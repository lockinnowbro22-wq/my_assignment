<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>Different Types of Lists</h1>

<h2>Ordered List</h2>
<ol type="I">
    <li>First</li>
    <li>Second</li>
</ol>

<h2>Unordered List</h2>
<ul style="list-style-type:circle;">
    <li>Apple</li>
    <li>Banana</li>
</ul>

<h2>Definition List</h2>
<dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language</dd>

    <dt>CSS</dt>
    <dd>Used for styling web pages</dd>
</dl>

</body>
</html>
